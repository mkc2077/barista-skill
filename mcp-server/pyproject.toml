[project]
name = "barista-mcp-server"
dynamic = ["version"]
description = "Barista Skill MCP Server - bilingual (zh/en) coffee-coach MCP service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "mcp[cli]>=1.8.0,<2.0",
]

[project.scripts]
barista-mcp = "server:main"
[project.optional-dependencies]
test = ["pytest>=8.0"]
http = [
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]
rag = ["sentence-transformers>=2.5.1"]  # RAG hybrid search (optional; pulls torch)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "rag_index.py"]

[tool.hatch.build.targets.wheel.force-include]
"../data" = "data"

[tool.hatch.version]
source = "regex"
path = "../data/version.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

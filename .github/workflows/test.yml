name: Gate (self_check + pytest + web typecheck)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MCP server (test + http extras)
        run: |
          python -m pip install --upgrade pip
          pip install "./mcp-server[test,http]"
      - name: self_check invariants
        run: python scripts/self_check.py
      - name: pytest
        run: python -m pytest mcp-server/test_data_consistency.py mcp-server/test_server.py -q

  # 前端门禁：tsc --noEmit 覆盖 web/next-app/src 全部 .ts/.tsx。
  # 防止 chatOnce 走错 API 端点、工具格式遗漏这类静默 bug 混进 main。
  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/next-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/next-app/package-lock.json"
      - name: Install deps
        run: npm ci
      - name: Type check (tsc --noEmit)
        run: npm run typecheck
